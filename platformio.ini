; Generated by LCD Wizard - https://lcdwizard.com
; Weatherdisplay - ESP32 (WROOM / WROVER)

[platformio]
src_dir = .

[env:esp32dev]
; Pinned: pioarduino, Arduino core 3.x - the core the Arduino IDE installs.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; The sketch folder is the source folder (src_dir above): every file in it is
; compiled, src/ included - so keep a backup copy of the project outside it.
; lib/ holds libraries, which PlatformIO builds as libraries, and test/ its
; unit tests: neither is part of the sketch.
build_src_filter = +<*> -<.git/> -<.svn/> -<lib/> -<test/>

lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI
    bblanchon/ArduinoJson@^7.0.0
    jnthas/Improv WiFi Library@0.0.4
    h2zero/NimBLE-Arduino@^2.3.7
    ; SPI - XPT2046 is read directly by the generated sketch - no driver library needed
    ; SPIFFS - Holds the image assets - bundled with the core. Upload data/ separately (see data/README.md)
    ; Wire - I2C bus - bundled with the core
; See LIBRARIES.md for install names and links.

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -DCORE_DEBUG_LEVEL=0
    -DIMPROV_WIFI_BLE_ENABLED
    ; ---- TFT_eSPI settings ----
    ; These are what PlatformIO uses. User_Setup.h is NOT read.
    ; Change a line here - TFT_RGB <-> TFT_BGR, or
    ; TFT_INVERSION_OFF <-> TFT_INVERSION_ON - then clean-build:
    ; pio run -t clean
    -DUSER_SETUP_LOADED
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_OFF
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT
    -DSUPPORT_TRANSACTIONS

; N4: 4 MB flash, no PSRAM.
; Big app partitions - app 3 MB, files 896 KB.
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.filesystem = spiffs
